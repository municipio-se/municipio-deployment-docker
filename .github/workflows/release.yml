name: Release

on:
  repository_dispatch:
    types: [source-tag]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag in source repo to build'
        required: true
        type: string
      force:
        description: 'Rebuild even if the image exists'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ctx
        run: |
          tag='${{ github.event.client_payload.tag || inputs.tag || github.ref_name }}'
          case "$tag" in
            ''|*[!A-Za-z0-9._/-]*) echo "refusing tag: $tag"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building \`$tag\` via \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.ctx.outputs.tag }}
            type=semver,pattern=v{{version}},value=${{ steps.ctx.outputs.tag }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.ctx.outputs.tag }}
            type=semver,pattern=v{{major}},value=${{ steps.ctx.outputs.tag }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Refuse to overwrite
        if: ${{ !inputs.force }}
        run: |
          if docker manifest inspect \
               ghcr.io/${{ github.repository }}:${{ steps.ctx.outputs.tag }} >/dev/null 2>&1; then
            echo "::error::${{ steps.ctx.outputs.tag }} already exists — use force to rebuild."
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/municipio-se/municipio-deployment
            org.opencontainers.image.version=${{ steps.ctx.outputs.tag }}
            municipio-se.source-ref=${{ steps.ctx.outputs.tag }}
            municipio-se.run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          build-args: |
            "MUNICIPIO_DEPLOYMENT_REF=feat/municipio-clone"
          secrets: |
            "acf_pro_key=${{ secrets.ACF_PRO_KEY }}"
          platforms: linux/amd64

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ctx.outputs.tag }}
        run: |
          git tag -f "$TAG" && git push -f origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Image: \`ghcr.io/${{ github.repository }}:$TAG\`"