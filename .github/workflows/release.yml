name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'test-*'
  repository_dispatch:
    types: [ source-tag ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ctx
        run: |
          tag='${{ github.event.client_payload.tag || inputs.tag || github.ref_name }}'
          case "$tag" in
            ''|*[!A-Za-z0-9._/-]*) echo "refusing tag: $tag"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building \`$tag\` via \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.ctx.outputs.tag }}
            type=semver,pattern=v{{version}},value=${{ steps.ctx.outputs.tag }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.ctx.outputs.tag }}
            type=semver,pattern=v{{major}},value=${{ steps.ctx.outputs.tag }}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            "MUNICIPIO_DEPLOYMENT_REF=stage"
          secrets: |
            "acf_pro_key=${{ secrets.ACF_PRO_KEY }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
