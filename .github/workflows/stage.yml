name: Stage

# Builds a release candidate image for a release PR in municipio-deployment.
# The tag-relay in the cluster dispatches `release-pr-stage` when a PR titled
# X.Y.Z is opened, pushed to, reopened or retitled. See README "Releases".

on:
  repository_dispatch:
    types: [release-pr-stage]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z)'
        required: true
        type: string
      head_sha:
        description: 'Full commit SHA in municipio-deployment to build'
        required: true
        type: string

# One build per version at a time. A newer pending push replaces an older
# pending one, which is fine: only the newest head matters.
concurrency:
  group: stage-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    name: Prepare release candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ctx.outputs.version }}
      head_sha: ${{ steps.ctx.outputs.head_sha }}
      pr: ${{ steps.ctx.outputs.pr }}
      rc: ${{ steps.rc.outputs.rc }}
    steps:
      - name: Resolve inputs
        id: ctx
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha || inputs.head_sha }}
          PR: ${{ github.event.client_payload.pr }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::refusing version: $VERSION"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::refusing sha: $HEAD_SHA"; exit 1; }
          [[ -z "$PR" || "$PR" =~ ^[0-9]+$ ]] || { echo "::error::refusing pr: $PR"; exit 1; }
          {
            echo "version=$VERSION"
            echo "head_sha=$HEAD_SHA"
            echo "pr=$PR"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse released versions
        run: |
          if docker buildx imagetools inspect "$IMAGE:v${{ steps.ctx.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::v${{ steps.ctx.outputs.version }} is already released — bump the PR title."
            exit 1
          fi

      # rc numbers count per version from 0: one more than the highest rc of
      # this version in the registry. The concurrency group serialises runs of
      # a version, and a failed run tags nothing, so its number is simply
      # reused. Legacy re-run tags (rc.57.2) count by their first number. An
      # empty listing means the listing broke, not that the repo is empty:
      # guessing rc.0 there would sort below the existing rcs and staging
      # would never pick it up.
      - name: Number release candidate
        id: rc
        env:
          VERSION: ${{ steps.ctx.outputs.version }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          PR: ${{ steps.ctx.outputs.pr }}
          REPO: ${{ github.repository }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token="$(curl -fsSu "$GHCR_USER:$GHCR_TOKEN" "https://ghcr.io/token?scope=repository:$REPO:pull" | jq -er .token)"
          tags="" url="/v2/$REPO/tags/list?n=1000" headers="$(mktemp)"
          while [[ -n "$url" ]]; do
            tags+="$(curl -fsS -D "$headers" -H "Authorization: Bearer $token" "https://ghcr.io$url" | jq -r '.tags // [] | .[]')"$'\n'
            url="$(sed -nE 's/^link: *<([^>]+)>; *rel="next".*/\1/Ip' "$headers" | tr -d '\r')"
          done
          grep -q . <<<"$tags" || { echo "::error::no tags listed for $REPO"; exit 1; }
          re="^v${VERSION//./\\.}-rc\\.([0-9]+)(\\.[0-9]+)?$"
          n=0
          while read -r t; do
            if [[ "$t" =~ $re ]] && (( BASH_REMATCH[1] >= n )); then n=$(( BASH_REMATCH[1] + 1 )); fi
          done <<<"$tags"
          rc="v$VERSION-rc.$n"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "Building \`$rc\` from municipio-deployment@\`$HEAD_SHA\`${PR:+ (PR #$PR)}" >> "$GITHUB_STEP_SUMMARY"

  # Each platform builds natively (no QEMU) and is pushed by digest only; the
  # merge job then tags the multi-platform index. linux/arm64 is what Docker
  # on Apple Silicon Macs runs.
  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The base image in Dockerfile is private on Docker Hub.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/municipio-se/municipio-deployment
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            municipio-se.source-ref=${{ needs.prepare.outputs.head_sha }}
            municipio-se.source-sha=${{ needs.prepare.outputs.head_sha }}
            municipio-se.rc=${{ needs.prepare.outputs.rc }}
            municipio-se.pr=${{ needs.prepare.outputs.pr }}
            municipio-se.run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          build-args: |
            MUNICIPIO_DEPLOYMENT_REF=${{ needs.prepare.outputs.head_sha }}
          secrets: |
            "acf_pro_key=${{ secrets.ACF_PRO_KEY }}"

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "platform_slug=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.platform_slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Two tags: the rc that staging's Image Updater follows, and src-<sha>
  # that promote uses to find the image built from the PR's final head.
  # Both are only created once every platform has built.
  merge:
    name: Tag release candidate
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        env:
          RC: ${{ needs.prepare.outputs.rc }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: |
          # Re-running only failed jobs keeps this run's rc, which a newer run
          # of the same version may have tagged in the meantime.
          if docker buildx imagetools inspect "$IMAGE:$RC" >/dev/null 2>&1; then
            echo "::error::$RC already exists — re-run the whole workflow to get a new rc."
            exit 1
          fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create \
            -t "$IMAGE:$RC" \
            -t "$IMAGE:src-$HEAD_SHA" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$RC"
